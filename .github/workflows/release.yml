name: Publish image
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  tests:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Validate version and image name
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = Path('VERSION').read_text().strip()
          if not re.fullmatch(r'\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', version):
              raise SystemExit('Invalid VERSION')
          if os.environ['RELEASE_TAG'] != 'v' + version:
              raise SystemExit('Tag must match VERSION')
          image = 'ghcr.io/' + os.environ['GITHUB_REPOSITORY'].lower()
          tags = image + ':' + version
          if '-' not in version:
              tags += ',' + image + ':latest'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + version + '\n' + 'tags=' + tags + '\n')
          PY
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.tags }}
          build-args: VERSION=${{ steps.release.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
